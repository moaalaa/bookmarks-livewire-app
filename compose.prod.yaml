services:

  web:
    build:
      context: .
      target: production
    image: bookmark-laravel-app:latest
    container_name: bookmark-laravel-app-prod
    env_file: .env.dev
    restart: unless-stopped
    ports:
      - "8000:80"
      - "5173:5173"
    depends_on:
      - mysql_db
    #   - cache

  mysql_db:
    image: mysql:8.4
    restart: unless-stopped
    environment:
        - MYSQL_ROOT_PASSWORD=4298
    volumes:
        - mysqldb-data:/var/lib/mysql
      
